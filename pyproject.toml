[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "know-my-professor"
version = "0.1.0"
description = "RAG chatbot over Northeastern Khoury faculty profiles"
requires-python = ">=3.11"

# One package, five deployables. Each Cloud Run unit installs ONLY its extra so
# its image stays lean (the scraper image never pulls fastapi/llama, etc.).
# The deploy/Dockerfile selects the extra via `pip install ".[${COMPONENT}]"`.
#
# Provider SDKs are their own groups, composed into the deployables below, so
# adding a model provider is one new group plus one reference — not an edit to
# every image that happens to talk to a model.
[project.optional-dependencies]

# --- provider SDK groups ---------------------------------------------------
embed-mistral = ["mistralai==1.9.10"]
chat-anthropic = ["anthropic==1.6.0"]
chat-llama = ["llama-api-client==0.6.0"]
extract-gemini = ["google-generativeai==0.8.3"]
# Profile extraction for colleges whose template has no parseable structure.
# Same SDK as chat-anthropic, kept a separate group so a deployable can pull
# the extractor without implying it also serves chat.
extract-anthropic = ["anthropic==1.6.0"]

# --- deployables -----------------------------------------------------------
profiles = [
    "requests==2.32.3",
    "beautifulsoup4==4.12.3",
    "google-cloud-storage==2.18.2",
    # Non-Khoury colleges are parsed by trafilatura + Claude, not by selectors.
    "trafilatura==2.1.0",
    "know-my-professor[extract-anthropic]",
]
weblinks = [
    "requests==2.32.3",
    "beautifulsoup4==4.12.3",
    "trafilatura==2.1.0",
    "google-cloud-storage==2.18.2",
    "know-my-professor[extract-gemini]",
]
ingest = [
    "google-cloud-storage==2.18.2",
    "pinecone==5.4.2",
    "know-my-professor[embed-mistral]",
]
api = [
    # fastapi >=0.118 so its starlette range overlaps streamlit's. The two never
    # share an image, but the dev install (requirements.txt) pulls both, and the
    # older pin resolved to a starlette that streamlit could not import.
    "fastapi==0.141.1",
    "uvicorn[standard]==0.32.1",
    "pinecone==5.4.2",
    "pydantic==2.10.3",
    # Both chat SDKs ship in the api image so CHAT_PROVIDER can be flipped
    # with an env var instead of a rebuild.
    "know-my-professor[embed-mistral,chat-anthropic,chat-llama]",
]
frontend = [
    "streamlit==1.58.0",
    "requests==2.32.3",
    # shared/schemas.py is the wire contract both ends parse against.
    "pydantic==2.10.3",
]
dev = ["pytest", "ruff"]

# DeepEval evaluation (evaluation/deepeval_eval). Local/manual only: it is in
# no image and NOT in requirements.txt, because it pulls opentelemetry, posthog
# and a pytest plugin — packages that would land in every developer's install
# and in every CI run to serve one opt-in tool. Install it when you want it:
#   pip install -e ".[eval]"
# The offline tests skip themselves when deepeval is absent
# (tests/test_deepeval_eval.py), so CI stays green without it.
eval = [
    "deepeval==4.2.3",
    "pinecone==5.4.2",
    # Plots for stored runs (evaluation/plots.py). Local analysis only, like the
    # rest of this extra — no image or test imports it.
    "matplotlib==3.10.7",
    "know-my-professor[embed-mistral,chat-anthropic]",
]

# Exactly what the offline suite needs, and nothing more. Cloud Build installs
# this before building an image, so the deploy gate stays fast: it skips the
# frontend extra (streamlit drags in pandas/pyarrow/numpy) because no test
# imports streamlit — the UI's pure logic lives in serving/frontend/formatting.py.
# GitHub Actions installs the FULL set instead, so cross-extra conflicts still
# get caught on PRs.
ci = [
    "know-my-professor[api,profiles,weblinks,ingest,dev]",
    "httpx",  # required by fastapi's TestClient
]

[tool.setuptools.packages.find]
include = ["core*", "preprocessing*", "shared*", "serving*"]

[tool.pytest.ini_options]
# Put the repo root on sys.path so tests `import core`, `import shared`, etc.
# (replaces the old conftest flat-import shim).
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# build/ and dist/ are named EXPLICITLY, not left to ruff's defaults or to
# .gitignore. Cloud Build installs non-editable (pip install ".[ci]"), so
# setuptools leaves a full copy of the tree in build/lib, and linting that copy
# fails the layering rule — its per-file-ignores are anchored to real paths like
# "serving/**", which "build/lib/serving/**" does not match.
#
# Locally this is invisible: ruff respects .gitignore, which already lists
# build/. `gcloud builds submit` does not upload .git, so inside Cloud Build
# there is no repo, respect-gitignore cannot fire, and the copy gets linted —
# 34 errors in code nobody wrote. Reproduce the CI behaviour with
# `ruff check . --no-respect-gitignore`.
extend-exclude = [".venv", "data", "*.egg-info", "build", "dist"]

[tool.ruff.lint]
# TID251 (banned-api) only, NOT TID252: relative imports within a package are
# the house style here, deliberately.
select = ["E", "F", "I", "B", "UP", "TID251"]
ignore = [
    "E501",  # long lines are handled by the formatter, not enforced here
    "B008",  # FastAPI's Depends(...) in defaults is idiomatic
]

# The restructure's whole point was one-way dependencies. Without a rule the
# layering erodes silently, so make the import direction a lint error:
#   serving -> core -> shared        preprocessing -> shared
# core must never import serving or preprocessing; shared must import neither.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"serving".msg = "core/preprocessing/shared must not import from serving."
"preprocessing".msg = "core and shared must not import from preprocessing."

[tool.ruff.lint.per-file-ignores]
"serving/**" = ["TID251"]
"preprocessing/**" = ["TID251"]
"tests/**" = ["TID251"]
"entrypoint.py" = ["TID251"]
